<?xml version="1.0" encoding="UTF-8"?>
<!-- hero-light.svg | asterxsk | squared specimen plate | transparent, no background fill or frame -->
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-labelledby="hl-title hl-desc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="hl-title">asterxsk</title>
