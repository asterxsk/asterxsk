# ---------------------------------------------------------------------------
# WHY THIS EXISTS
# ---------------------------------------------------------------------------
# This profile README used to embed third-party GitHub-stats cards. Every one
# of those hosts has since either gone dark or started answering 402 Payment
# Required / 503 Service Unavailable under load. When a third-party host dies
# the <img> in the profile silently degrades to a broken-image glyph, and the
# profile looks abandoned even though nothing here changed.
#
# The assets regenerated by this workflow are SELF-OWNED. They are files in
# this repository, committed here by GitHub Actions via the default
# GITHUB_TOKEN, and served from raw.githubusercontent.com. Nothing in the
# render path depends on a company that can shut down, so these assets cannot
# rot the way the hosted cards did.
#
# CAMO / CACHE CAVEAT
# -------------------
# GitHub proxies every README image through its camo image proxy and caches it
# by URL. When this workflow rewrites an asset, the URL does not change, so
# visitors and the mobile app can keep seeing the OLD render for a while. To
# force a fresh fetch, bump the "?v=N" query string on the README embed, e.g.
# assets/telemetry-dark.svg?v=7 -> assets/telemetry-dark.svg?v=8. A changed
# query string is a new camo cache key, so the new bytes are pulled at once.
# Bump the dark and light variants together so the pair never desyncs.
#
# SCHEDULE
# --------
# Runs daily at 06:17 UTC. workflow_dispatch allows a manual refresh. Pushes
# touching scripts/** or this workflow itself rehearse the generate-and-commit
# path before the next scheduled run.
# ---------------------------------------------------------------------------

name: Refresh profile telemetry

on:
  schedule:
    # Daily at 06:17 UTC. Off the top of the hour to dodge the cron thundering
    # herd that delays :00 schedules.
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the generator needs commit activity beyond the tip,
          # and v4 defaults to a shallow fetch-depth of 1.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate telemetry assets
        id: gen
        run: |
          node scripts/metrics.mjs | tee gen.log
          echo "count=$(sed -n 's/^metrics rendered: //p' gen.log)" >> "$GITHUB_OUTPUT"
        env:
          # OPTIONAL: the GraphQL-backed "contributions / yr" metric needs a
          # PAT (classic token with read:user); the default GITHUB_TOKEN's
          # GraphQL view is unreliable for contribution stats. Wiring it via
          # env is safe when the secret is unset: GitHub expands the reference
          # to an empty string and the step still runs, so the build cannot
          # break. scripts/metrics.mjs reads GH_TOKEN || GITHUB_TOKEN and, when
          # both are empty, pushes "no GH_TOKEN, skipped" and omits the metric
          # rather than printing a placeholder (HARD RULE: no unsupplied
          # numbers). If the secret does not exist, do nothing -- the job still
          # succeeds without the GraphQL metric.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # The contributions figure needs a PAT (see the GH_TOKEN note above). If that
      # secret is absent the regenerated card comes back one figure short, and
      # committing it would silently delete a number from the live profile -- a
      # failure nobody notices until they look at an older screenshot.
      # A stale-but-correct card beats a fresh-but-thinner one, so refuse the
      # downgrade and warn instead. The check counts the label elements the
      # renderer emits per figure, so it tracks the template automatically.
      - name: Refuse to downgrade the card
        id: guard
        run: |
          prev=$(git show HEAD:assets/telemetry-dark.svg 2>/dev/null | grep -c 'letter-spacing="1.4"' || true)
          new='${{ steps.gen.outputs.count }}'
          if [ -n "$new" ] && [ "${prev:-0}" -gt 0 ] && [ "$new" -lt "$prev" ]; then
            echo "::warning::Regenerated card has $new figures; the committed card has $prev. Restoring assets and skipping the commit. Add a GH_TOKEN secret (classic PAT with read:user) to restore the contributions figure."
            git checkout -- assets
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed telemetry
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only generated output so an unrelated edit can never ride
          # along in this bot commit.
          git add -A assets

          # Empty-commit guard: commit only when the index or the working tree
          # actually differs from HEAD. On a no-op refresh this exits clean.
          if git diff --quiet && git diff --cached --quiet; then
            echo "No telemetry changes; nothing to commit."
            exit 0
          fi

          git commit -m "chore: refresh telemetry [skip ci]"
          git push
